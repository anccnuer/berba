<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Task 示例</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Task 示例</h1>
      <p>后台定时任务：间隔、每日、延时触发与无界面分发。</p>
    </header>

    <p class="status" id="status" aria-live="polite">正在读取任务状态…</p>

    <label class="check">
      <input type="checkbox" id="exact"> 请求精确闹钟（系统未授权时自动降级）
    </label>

    <section class="actions">
      <button id="every">每 15 分钟</button>
      <button id="daily" class="secondary">每天 08:30</button>
      <button id="delay" class="secondary">60 秒后一次</button>
      <button id="cancel" class="secondary">取消 demo</button>
      <button id="refresh" class="secondary">刷新</button>
    </section>

    <pre id="out" aria-live="polite">等待操作…</pre>
  </main>
  <script src="app.js"></script>
</body>
</html>
