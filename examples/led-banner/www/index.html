<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101014">
  <title>应援横幅</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>应援横幅</h1>
    </header>

    <section class="preview-card" aria-hidden="true">
      <div class="preview" id="preview">
        <div class="preview-track" id="previewTrack">
          <span class="preview-chunk" id="previewA"></span>
          <span class="preview-chunk" id="previewB"></span>
        </div>
      </div>
    </section>

    <main class="card">
      <label class="field" for="text">
        <span class="field-label">应援文字</span>
        <input id="text" type="text" maxlength="40" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="输入应援文字">
      </label>

      <div class="field">
        <span class="field-label"><span>字号</span><b class="value" id="sizeVal">60</b></span>
        <input id="size" type="range" min="20" max="90" step="1" value="60">
      </div>

      <div class="field">
        <span class="field-label"><span>滚动速度</span><span class="value-line"><b class="value" id="speedVal">320</b><em>px/s</em></span></span>
        <input id="speed" type="range" min="80" max="900" step="20" value="320">
      </div>

      <div class="field">
        <span class="field-label">文字颜色</span>
        <div class="swatches" id="textColors"></div>
      </div>

      <div class="field">
        <span class="field-label">背景颜色</span>
        <div class="swatches" id="bgColors"></div>
      </div>

      <label class="toggle-row" for="glow">
        <span class="toggle-text">
          <b>荧光光晕</b>
          <small>给文字加一层霓虹辉光</small>
        </span>
        <span class="switch">
          <input id="glow" type="checkbox" checked>
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
      </label>

      <button id="start" class="start" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l10.5-6.86a1.06 1.06 0 0 0 0-1.8L9.56 4.24A1.06 1.06 0 0 0 8 5.14z"/></svg>
        <span>进入全屏</span>
      </button>
      <p class="hint" id="hint">进入后双击屏幕或按返回键退出</p>
    </main>
  </div>

  <div class="banner" id="banner" aria-hidden="true">
    <div class="stage">
      <div class="track" id="track">
        <span class="chunk" id="chunkA"></span>
        <span class="chunk" id="chunkB"></span>
      </div>
    </div>
    <p class="exit-hint">双击退出</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
